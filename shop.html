<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse The Lineage | FAA Catalog</title>
    <meta name="description" content="Acquire exclusive designer items from the current FAA catalogue line. Limited stock distribution loops.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding-top: 120px;">

    <nav class="navbar navbar-expand-lg navbar-dark faa-navbar fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand brand-logo" href="index.html">FAA</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link nav-link-faa" href="index.html">Manifesto</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-faa active" href="shop.html">Shop Matrix</a></li>
                </ul>
                <div class="d-flex align-items-center text-white" style="cursor: pointer;" onclick="window.location.href='cart.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span class="cart-badge">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT DISTRIBUTION SYSTEM -->
    <div class="container-fluid px-4 my-5">
        <div class="row">
            <!-- Dynamic Category Control Pipeline Sidebar -->
            <aside class="col-lg-2 mb-5">
                <div class="sticky-top" style="top: 120px; z-index:10;">
                    <h2 class="filter-sidebar-title mb-3">Lineage Filters</h2>
                    <ul class="list-unstyled mb-5">
                        <li class="filter-list-item py-2 active" data-filter-key="category" data-filter-value="all">All Silhouettes</li>
                        <li class="filter-list-item py-2" data-filter-key="category" data-filter-value="apparel">Apparel</li>
                        <li class="filter-list-item py-2" data-filter-key="category" data-filter-value="footwear">Footwear</li>
                        <li class="filter-list-item py-2" data-filter-key="category" data-filter-value="accessories">Accessories</li>
                    </ul>

                    <h2 class="filter-sidebar-title mb-3">Curations</h2>
                    <ul class="list-unstyled">
                        <li class="filter-list-item py-2" data-filter-key="tag" data-filter-value="new">New Collections</li>
                        <li class="filter-list-item py-2" data-filter-key="tag" data-filter-value="trending">Trending</li>
                        <li class="filter-list-item py-2" data-filter-key="tag" data-filter-value="classic">Timeless Classics</li>
                    </ul>
                </div>
            </aside>

            <!-- Active Rendering Target -->
            <main class="col-lg-10">
                <div class="row g-4" id="catalog-grid-target">
                    <!-- Controlled Output Loops Injected via Javascript -->
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
